version: '3.8'

services:
  db:
    image: postgres:14
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - fullstack_net

  backend:
    build: ./backend
    container_name: flask_backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - fullstack_net

  frontend:
    build: ./frontend
    container_name: nginx_frontend
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - backend
    networks:
      - fullstack_net

volumes:
  db_data:

networks:
  fullstack_net:
