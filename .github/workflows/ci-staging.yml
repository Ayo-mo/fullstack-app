name: CI/CD - Staging

on:
  push:
    branches: [ "staging" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging

    env:
      POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.STAGING_POSTGRES_DB }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker compose -f docker-compose.yml build backend
          docker tag fullstack-app_backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-backend:staging
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-backend:staging
      
      - name: Build and push frontend image
        run: |
          docker compose -f docker-compose.yml build frontend
          docker tag fullstack-app_frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-frontend:staging
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-frontend:staging

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-backend:staging
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-frontend:staging
            cd /home/ayodeji889/fullstack-app
            docker-compose down
            docker-compose up -d --force-recreate    
          

      