name: CI/CD - Production

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    POSTGRES_USER: ${{ secrets.PRODUCTION_POSTGRES_USER }}
    POSTGRES_PASSWORD: ${{ secrets.PRODUCTION_POSTGRES_PASSWORD }}
    POSTGRES_DB: ${{ secrets.PRODUCTION_POSTGRES_DB }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        run: |
          docker-compose -f docker-compose.yml build
          docker tag fullstack-app_backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest
