global:
  scrape_interval: 5s  # How often to collect metrics

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "fullstack-app"
    static_configs:
      - targets: ["fullstack-app:5000"]  # Replace "web" with your app container name, port 5000 if Flask


