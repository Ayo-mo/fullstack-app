global:
  scrape_intevals: 5s


scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'backend' 
    static_configs:
      - targets: ['backend:5000']
      
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    
  
